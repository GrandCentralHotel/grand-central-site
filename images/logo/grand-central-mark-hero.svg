<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 24 172 124" role="img" aria-label="Grand Central">
  <title>Grand Central</title>
  <!-- HERO CUT. Same frame and geometry as grand-central-mark.svg, drawn at
       roughly half the stroke weight with the detail that only reads large:
       the dentil course, arch keystones and imposts, pilaster capitals and
       bases, and a full twelve-tick clock.
       Use above ~180px. Below that use the sturdy cut, which holds together. -->
  <g fill="none" stroke="currentColor" stroke-linecap="butt">

    <!-- granite podium and concourse floor -->
    <path d="M0 140h160" stroke-width="2"/>
    <path d="M6 132h148" stroke-width="1.2"/>

    <!-- corner piers, with capitals and bases -->
    <path d="M8 44v88M152 44v88" stroke-width="1.3"/>
    <path d="M4 64h8M148 64h8M4 128h8M148 128h8" stroke-width="0.9"/>

    <!-- the three great arches, with keystones and imposts -->
    <path d="M18 132v-32a18 18 0 0 1 36 0v32" stroke-width="1.5"/>
    <path d="M62 132v-32a18 18 0 0 1 36 0v32" stroke-width="1.5"/>
    <path d="M106 132v-32a18 18 0 0 1 36 0v32" stroke-width="1.5"/>
    <path d="M36 78v8M80 78v8M124 78v8" stroke-width="1.3"/>
    <path d="M15 100h6M51 100h6M59 100h6M95 100h6M103 100h6M139 100h6" stroke-width="0.8"/>

    <!-- oculi in the spandrels -->
    <circle cx="58" cy="90" r="2.5" stroke-width="1"/>
    <circle cx="102" cy="90" r="2.5" stroke-width="1"/>

    <!-- dentil course beneath the cornice -->
    <path d="M14 61v3M20 61v3M26 61v3M32 61v3M38 61v3M44 61v3M50 61v3M56 61v3M62 61v3M68 61v3M74 61v3M80 61v3M86 61v3M92 61v3M98 61v3M104 61v3M110 61v3M116 61v3M122 61v3M128 61v3M134 61v3M140 61v3M146 61v3" stroke-width="0.7"/>

    <!-- cornice, then the carved frieze: RAILWAY | STATION -->
    <path d="M4 60h152" stroke-width="2"/>
    <path d="M8 44h56M96 44h56" stroke-width="1.3"/>
    <rect x="22" y="49" width="5" height="5" stroke-width="0.8"/>
    <rect x="133" y="49" width="5" height="5" stroke-width="0.8"/>

    <!-- the station clock, seated on the cornice, breaking the parapet -->
    <g stroke="var(--logo-accent, currentColor)">
      <circle cx="80" cy="46" r="14" stroke-width="1.6"/>
      <path d="M80 34.5V33M85.8 36V34.7M90 40.3l1.3-.8M91.5 46H93M90 51.8l1.3.7M85.8 56l.7 1.3M80 57.5V59M74.3 56l-.8 1.3M70 51.8l-1.3.7M68.5 46H67M70 40.3l-1.3-.8M74.3 36l-.8-1.3" stroke-width="0.8"/>
      <path d="M80 46l8.7-5M80 46l-6.1-3.5" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </g>
</svg>
